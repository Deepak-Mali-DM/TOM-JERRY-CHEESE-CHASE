<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 90" width="360" height="90">
  <defs>
    <filter id="logo-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <linearGradient id="tom-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="cheese-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <g filter="url(#logo-shadow)">
    <!-- Little Cheese Emblem Left -->
    <g transform="translate(10, 16) scale(0.65)">
      <polygon points="10,40 70,18 74,54 14,70" fill="#d97706" stroke="#451a03" stroke-width="4" stroke-linejoin="round"/>
      <polygon points="10,40 70,18 50,10 2,32" fill="#fbbf24" stroke="#451a03" stroke-width="4" stroke-linejoin="round"/>
      <polygon points="2,32 10,40 14,70 4,60" fill="#f59e0b" stroke="#451a03" stroke-width="4" stroke-linejoin="round"/>
      <circle cx="36" cy="24" r="5" fill="#f59e0b" stroke="#451a03" stroke-width="1.5"/>
      <circle cx="50" cy="45" r="6" fill="#92400e" stroke="#451a03" stroke-width="2"/>
    </g>

    <!-- Top Text: TOM & JERRY with cartoon styling -->
    <text x="75" y="38" font-family="'Fredoka', 'Nunito', 'Arial Black', sans-serif" font-weight="900" font-size="28" fill="#1e293b" letter-spacing="1">TOM</text>
    <text x="75" y="35" font-family="'Fredoka', 'Nunito', 'Arial Black', sans-serif" font-weight="900" font-size="28" fill="url(#tom-grad)" letter-spacing="1">TOM</text>

    <!-- Jerry Ampersand with Mouse Ears -->
    <g transform="translate(142, 10)">
      <circle cx="6" cy="6" r="4" fill="#6b7280" stroke="#1e293b" stroke-width="1.5"/>
      <circle cx="6" cy="6" r="2.5" fill="#fca5a5"/>
      <circle cx="16" cy="6" r="4" fill="#6b7280" stroke="#1e293b" stroke-width="1.5"/>
      <circle cx="16" cy="6" r="2.5" fill="#fca5a5"/>
      <text x="11" y="24" font-family="'Fredoka', sans-serif" font-weight="900" font-size="22" fill="#d97706" text-anchor="middle">&amp;</text>
    </g>

    <text x="175" y="38" font-family="'Fredoka', 'Nunito', 'Arial Black', sans-serif" font-weight="900" font-size="28" fill="#1e293b" letter-spacing="1">JERRY</text>
    <text x="175" y="35" font-family="'Fredoka', 'Nunito', 'Arial Black', sans-serif" font-weight="900" font-size="28" fill="#fb923c" letter-spacing="1">JERRY</text>

    <!-- Subtitle Banner: CHEESE CHASE -->
    <g transform="translate(75, 46)">
      <!-- 3D Banner Base -->
      <rect x="0" y="4" width="265" height="34" rx="8" fill="#b45309"/>
      <rect x="0" y="0" width="265" height="34" rx="8" fill="url(#cheese-grad)" stroke="#78350f" stroke-width="3"/>

      <!-- Tiny Cheese Holes on banner -->
      <circle cx="20" cy="17" r="3" fill="#d97706" opacity="0.6"/>
      <circle cx="245" cy="14" r="4" fill="#d97706" opacity="0.6"/>
      <circle cx="140" cy="28" r="2.5" fill="#d97706" opacity="0.5"/>

      <text x="132" y="24" font-family="'Fredoka', 'Nunito', 'Arial Black', sans-serif" font-weight="900" font-size="20" fill="#451a03" text-anchor="middle" letter-spacing="2">CHEESE CHASE</text>
    </g>
  </g>
</svg>
